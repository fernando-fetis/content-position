# Cluster profile for src/remote/launch.py: copy to src/remote/slurm.ini (untracked) and fill in. Every key of [all] and of [gpu] or [cpu] becomes the sbatch flag --key=value of every job of that kind.
[all]
partition = <partition>
account = <account>
cpus-per-task = 8
mem = 64G
comment = <a short tag for your jobs>

[gpu]
gres = gpu:1

[cpu]
gres = none
mem = 32G

[launch]
# submitted jobs allowed per user by the cluster
max_queued = 32
