# CENIA profile for src/remote/launch.py: on the login node, copy to src/remote/slurm.ini.
[all]
partition = ialab-high
account = default-account
qos = regular
nodelist = llaima
cpus-per-task = 8
mem = 64G
comment = experiments

[gpu]
gres = gpu:a40:1

[cpu]
gres = none
mem = 32G

[launch]
max_queued = 32
